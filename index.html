<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>Aditya ❤ Ayushi — Wedding Invitation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Shubh Vivah · Aditya Raj weds Ayushi Kumari · December 9, 2026, Wednesday · Muzaffarpur">
<meta name="theme-color" content="#FAF5EE">
<!-- WhatsApp / Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Aditya ❤ Ayushi — Wedding Invitation">
<meta property="og:site_name" content="Aditya ❤ Ayushi">
<meta property="og:description" content="December 9, 2026, Wednesday · Muzaffarpur. Eagerly awaiting your presence.">
<meta property="og:image" content="https://shubh-vivaah.netlify.app/assets/og-cover.jpg">
<meta property="og:url" content="https://shubh-vivaah.netlify.app/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_IN">
<meta property="og:locale:alternate" content="hi_IN">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hind:wght@400;500&family=Jost:wght@300;400;500&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->

<!-- Shared line-art symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-lotus" viewBox="0 0 64 40">
      <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 4C24 14 24 26 32 34C40 26 40 14 32 4Z"/>
        <path d="M32 34C22 30 16 20 18 10C26 14 30 22 32 34"/>
        <path d="M32 34C42 30 48 20 46 10C38 14 34 22 32 34"/>
        <path d="M32 34C20 34 8 28 4 18C14 18 24 24 32 34"/>
        <path d="M32 34C44 34 56 28 60 18C50 18 40 24 32 34"/>
        <path d="M12 38H52"/>
      </g>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 64">
      <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 0V8M12 12V20M12 24V30" stroke-dasharray="0"/>
        <circle cx="12" cy="10" r="2"/><circle cx="12" cy="22" r="2"/>
        <path d="M12 30C6.5 30 5.5 37 5.5 43C5.5 47 3.5 49 2 51H22C20.500 49 18.500 47 18.500 43C18.500 37 17.500 30 12 30Z"/>
        <path d="M7 40H17"/>
        <circle cx="12" cy="55" r="2.200"/>
      </g>
    </symbol>
    <symbol id="i-ganesha" viewBox="0 0 120 132">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- mukut -->
        <path d="M46 30L49 15L55 22L60 9L65 22L71 15L74 30"/>
        <circle cx="60" cy="5.500" r="2"/>
        <path d="M43 31H77"/>
        <!-- ears -->
        <path d="M43 36C27 24 9 38 15 58C19 71 33 74 41 64"/>
        <path d="M77 36C93 24 111 38 105 58C101 71 87 74 79 64"/>
        <path d="M34 42C26 44 23 54 29 61"/>
        <path d="M86 42C94 44 97 54 91 61"/>
        <!-- face -->
        <path d="M43 32C41 44 41 56 46 66"/>
        <path d="M77 32C79 44 79 56 74 66"/>
        <!-- eyes and tilak -->
        <path d="M48 49C50 46.500 53 46.500 55 49"/>
        <path d="M65 49C67 46.500 70 46.500 72 49"/>
        <path d="M57 40H63M57 43H63M60 37V45"/>
        <!-- trunk -->
        <path d="M53 56C52 70 47 80 52 92C57 104 74 104 76 92C77 85 69 82 67 88"/>
        <path d="M67 56C68 68 62 76 64 86"/>
        <path d="M53 68H65M52 76H63"/>
        <!-- tusks -->
        <path d="M46 66C42 72 38 73 35 71"/>
        <path d="M74 66C78 71 81 72 84 70"/>
        <!-- lotus seat -->
        <path d="M60 112C55 116 55 122 60 126C65 122 65 116 60 112Z"/>
        <path d="M60 126C52 125 46 120 45 114C52 115 57 119 60 126"/>
        <path d="M60 126C68 125 74 120 75 114C68 115 63 119 60 126"/>
        <path d="M60 126C50 128 38 125 32 118C42 117 52 120 60 126"/>
        <path d="M60 126C70 128 82 125 88 118C78 117 68 120 60 126"/>
      </g>
    </symbol>
    <symbol id="i-arch" viewBox="0 0 300 400">
      <path pathLength="1" fill="none" stroke="currentColor" d="M30 400V170Q28 142 52 138Q52 106 78 100Q84 70 112 66Q128 52 150 28Q172 52 188 66Q216 70 222 100Q248 106 248 138Q272 142 270 170V400"/>
    </symbol>
  </defs>
</svg>

<!-- ============ OPENING GATE ============ -->
<div id="gate" class="gate" role="dialog" aria-modal="true" aria-label="Invitation">
  <div class="gate-glow" aria-hidden="true"></div>
  <div class="door door-l" aria-hidden="true"><div class="door-face"></div></div>
  <div class="door door-r" aria-hidden="true"><div class="door-face"></div></div>

  <button class="lang-btn gate-lang" type="button" data-action="lang"></button>

  <div class="gate-center">
    <svg class="ganesha" aria-hidden="true"><use href="#i-ganesha"/></svg>
    <p class="om" data-t="om" lang="hi"></p>
    <div class="seal" aria-hidden="true"><div class="seal-inner" data-monogram></div></div>
    <h1 class="gate-names" data-names="plain"></h1>
    <p class="gate-date"><span data-t="heroDate"></span><span data-city></span></p>
    <button id="openBtn" class="open-btn" type="button" data-t="ui.open"></button>
  </div>
</div>

<!-- ============ TOP BAR ============ -->
<header class="topbar" id="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top" data-scroll data-brand></a>
    <nav class="links" aria-label="Sections">
      <a href="#story" data-scroll data-sec="story" data-t="ui.navInvite"></a>
      <a href="#functions" data-scroll data-sec="functions" data-t="ui.navEvents"></a>
      <a href="#gallery" data-scroll data-sec="gallery" data-t="ui.navGallery"></a>
    </nav>
    <div class="topbar-actions">
      <button class="lang-btn" type="button" data-action="lang"></button>
      <button class="music-btn" id="musicBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="ic-play" d="M8 5.500v13l10-6.500z"/>
          <g class="ic-pause"><path d="M8 5.500v13"/><path d="M16 5.500v13"/></g>
        </svg>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </div>
  </div>
</header>

<canvas id="petals" aria-hidden="true"></canvas>

<main id="top">

  <!-- 1 · HERO -->
  <section class="sec hero" id="hero" data-flowers="hero">
    <div class="mandala" data-mandala aria-hidden="true"></div>
    <svg class="bell bell-l" aria-hidden="true"><use href="#i-bell"/></svg>
    <svg class="bell bell-r" aria-hidden="true"><use href="#i-bell"/></svg>
    <div class="wrap">
      <p class="om" data-t="om" lang="hi"></p>
      <div class="jharokha">
        <svg class="arch arch-outer" viewBox="0 0 300 400" aria-hidden="true"><use href="#i-arch"/></svg>
        <svg class="arch arch-inner" viewBox="0 0 300 400" aria-hidden="true"><use href="#i-arch"/></svg>
        <div class="jharokha-in">
          <div class="seal seal-lg"><div class="seal-inner" data-monogram></div></div>
          <svg class="lotus" aria-hidden="true"><use href="#i-lotus"/></svg>
        </div>
      </div>
      <h2 class="hero-names" data-names="rise"></h2>
      <p class="hero-quote" data-t="quote"></p>
      <p class="date-chip"><span class="date-main" data-t="heroDate"></span><span class="date-sep" aria-hidden="true">•</span><span class="date-place" data-city></span></p>
      <a class="btn btn-solid btn-cta" href="#story" data-scroll><span data-t="ui.celebrate"></span><span aria-hidden="true">✿</span></a>
    </div>
  </section>

  <!-- OUR INVITATION (photo + message) -->
  <section class="sec story" id="story" data-flowers="invitation">
    <div class="wrap reveal">
      <p class="eyebrow" data-t="ui.secStory"></p>
      <h2 class="sec-title" data-t="storyTitle"></h2>
      <div class="divider" aria-hidden="true"><i></i></div>
      <div class="invite-stage">
        <img data-story-img alt="">
        <div class="invite-overlay">
          <p class="invite" data-story></p>
          <p class="sub" data-t="storySub"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 2 · BLESSINGS -->
  <section class="sec band" id="blessings" data-flowers="blessings">
    <div class="wrap reveal">
      <svg class="ganesha" aria-hidden="true"><use href="#i-ganesha"/></svg>
      <p class="eyebrow" data-t="ui.secBlessings"></p>
      <p class="shloka" lang="hi" data-shloka></p>
      <div class="divider" aria-hidden="true"><i></i></div>
      <p class="blessing" data-t="card.grace"></p>
    </div>
  </section>

  <!-- 3 · FORMAL INVITATION -->
  <section class="sec" id="invitation" data-flowers="invitation">
    <div class="mandala" data-mandala aria-hidden="true"></div>
    <div class="wrap reveal">
      <p class="eyebrow" data-t="ui.secInvitation"></p>
      <article class="card-stationery">
        <svg class="corner c-tl" aria-hidden="true"><use href="#i-lotus"/></svg>
        <svg class="corner c-tr" aria-hidden="true"><use href="#i-lotus"/></svg>
        <svg class="corner c-bl" aria-hidden="true"><use href="#i-lotus"/></svg>
        <svg class="corner c-br" aria-hidden="true"><use href="#i-lotus"/></svg>
        <div class="card-body" data-card></div>
      </article>
    </div>
  </section>

  <!-- 4 · COUNTDOWN -->
  <section class="sec band" id="countdown" data-flowers="countdown">
    <div class="wrap reveal">
      <p class="eyebrow" data-t="ui.secCountdown"></p>
      <div class="count" id="count" role="timer" aria-live="off">
        <div class="unit"><b id="cd-d">0</b><span data-t="ui.days"></span></div>
        <div class="unit"><b id="cd-h">00</b><span data-t="ui.hours"></span></div>
        <div class="unit"><b id="cd-m">00</b><span data-t="ui.minutes"></span></div>
        <div class="unit"><b id="cd-s">00</b><span data-t="ui.seconds"></span></div>
      </div>
      <p class="count-note" id="countNote"></p>
      <p class="count-date" data-t="heroDate"></p>
    </div>
  </section>

  <!-- 5 · FUNCTIONS -->
  <section class="sec" id="functions" data-flowers="functions">
    <div class="mandala" data-mandala aria-hidden="true"></div>
    <div class="wrap">
      <p class="eyebrow reveal" data-t="ui.secFunctions"></p>
      <div class="events-wrap" id="events"></div>
    </div>
  </section>

  <!-- 6 · GALLERY -->
  <section class="sec band" id="gallery" data-flowers="gallery">
    <div class="wrap wrap-wide">
      <p class="eyebrow reveal" data-t="ui.secGallery"></p>
      <div class="masonry" id="masonry"></div>
    </div>
  </section>

  <!-- 7 · CLOSING -->
  <section class="sec closing" id="closing" data-flowers="closing">
    <div class="mandala" data-mandala aria-hidden="true"></div>
    <div class="wrap reveal">
      <svg class="lotus" aria-hidden="true"><use href="#i-lotus"/></svg>
      <p class="eyebrow" data-t="ui.secClosing"></p>
      <p class="thanks" data-t="ui.thanks"></p>
      <p class="awaiting" data-t="awaiting"></p>
      <div class="divider" aria-hidden="true"><i></i></div>
      <div class="actions">
        <a class="btn btn-solid" id="shareBtn" href="#" target="_blank" rel="noopener" data-t="ui.share"></a>
        <button class="btn" id="copyBtn" type="button" data-t="ui.copy"></button>
        <button class="btn" id="pdfBtn" type="button" data-t="ui.pdf"></button>
      </div>
      <div class="rsvp">
        <p class="eyebrow" data-t="ui.rsvp"></p>
        <p class="rsvp-name" data-t="senderName"></p>
        <p class="rsvp-phones" id="rsvpPhones"></p>
      </div>
      <a class="to-top" href="#top" data-t="ui.top"></a>
      <p class="foot" data-brandline></p>
      <p class="foot-sub"><span data-t="heroDate"></span> • <span data-city></span></p>
    </div>
  </section>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
  <button class="lb-btn lb-close" type="button" data-lb="close">&times;</button>
  <button class="lb-btn lb-prev" type="button" data-lb="prev">&lsaquo;</button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-next" type="button" data-lb="next">&rsaquo;</button>
  <p class="lb-count" id="lbCount"></p>
</div>

<!-- Invitation film -->
<div class="lightbox" id="filmBox" hidden role="dialog" aria-modal="true">
  <button class="lb-btn lb-close" type="button" id="filmClose">&times;</button>
  <video id="film" controls playsinline preload="none"></video>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<!--BODY-END-->
</body>
</html>
